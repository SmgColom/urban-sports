<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/logo.png" />

    <!-- SEO basico -->
    <title>Urban Sports | Catalogo de productos deportivos urbanos</title>
    <meta
      name="description"
      content="Explora el catalogo de Urban Sports: skate, calzado y accesorios deportivos urbanos."
    />
    <meta name="theme-color" content="#0f0f12" />

    <!-- Open Graph (compartir en redes) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Urban Sports" />
    <meta
      property="og:description"
      content="Catalogo de productos deportivos urbanos: skate, calzado y accesorios."
    />
    <meta property="og:image" content="/logo.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Urban Sports" />
    <meta
      name="twitter:description"
      content="Catalogo de productos deportivos urbanos."
    />
    <meta name="twitter:image" content="/logo.png" />
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
